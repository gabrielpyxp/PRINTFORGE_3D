version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: printforge-db
    environment:
      POSTGRES_DB: printforge
      POSTGRES_USER: printforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-printforge123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printforge -d printforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: printforge-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://printforge:${DB_PASSWORD:-printforge123}@postgres:5432/printforge
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-gere_uma_chave_secreta_de_pelo_menos_32_caracteres_aqui}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:5173
      CALCULATOR_SERVICE_URL: http://backend-java:8080
      CALCULATOR_TIMEOUT_MS: 3000
      CALCULATOR_STRICT: "false"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      backend-java:
        condition: service_started
    volumes:
      - ./backend-node/src:/app/src
      - ./backend-node/package.json:/app/package.json
      - ./backend-node/.env:/app/.env

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: printforge-calculator
    environment:
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - ./backend-java:/app
      - /app/target

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: printforge-frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:5173"
    depends_on:
      - backend-node
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: