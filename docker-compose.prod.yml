# docker-compose.prod.yml - Deploy de produção (Railway/Render/Fly.io)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: printforge-db-prod
    environment:
      POSTGRES_DB: printforge
      POSTGRES_USER: printforge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printforge -d printforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile.prod
    container_name: printforge-api-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://printforge:${DB_PASSWORD}@postgres:5432/printforge
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: https://printforge-3d.vercel.app
      CALCULATOR_SERVICE_URL: http://backend-java:8080
      CALCULATOR_TIMEOUT_MS: 3000
      CALCULATOR_STRICT: "false"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile.prod
    container_name: printforge-calculator
    environment:
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: "https://printforge-3d.vercel.app,http://localhost:3000"
      SPRING_PROFILES_ACTIVE: production
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: printforge-frontend-prod
    environment:
      VITE_API_URL: https://api.seu-dominio.com/api
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-node
    restart: unless-stopped
    # Para produção real, usar nginx reverso com SSL
    # volumes:
    #   - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data: