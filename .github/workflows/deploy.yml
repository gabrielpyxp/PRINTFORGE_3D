# GitHub Actions CI/CD Pipeline
# Arquivo: .github/workflows/deploy.yml

name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # TESTES E LINT
  # ===========================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend
        run: cd frontend && npm ci

      - name: Lint Frontend
        run: cd frontend && npm run lint

      - name: Test Frontend
        run: cd frontend && npm run test -- --run

      - name: Test Backend Node
        run: |
          cd backend-node
          npm ci
          npm test

      - name: Test Backend Java
        run: |
          cd backend-java
          ./mvnw test

  # ===========================================
  # BUILD DOCKER IMAGES
  # ===========================================
  build-frontend:
    name: Build Frontend Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=ghca,mode=max

  build-backend-node:
    name: Build Backend Node Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Backend Node
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          file: ./backend-node/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend-node:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend-node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend-java:
    name: Build Backend Java Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push Backend Java
        uses: docker/build-push-action@v5
        with:
          context: ./backend-java
          file: ./backend-java/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend-java:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend-java:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # DEPLOY RAILWAY
  # ===========================================
  deploy-railway:
    name: Deploy to Railway
    needs: [build-frontend, build-backend-node, build-backend-java]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Railway
        uses: railwayapp/deploy-action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: all
          environment: production

      - name: Wait for deploy
        run: |
          echo "Aguardando deploy..."
          sleep 60

      - name: Health Check API
        run: |
          sleep 30
          curl -f https://api.printforge3d.com/health || exit 1

      - name: Health Check Calculator
        run: |
          curl -f https://calculator.printforge3d.com/actuator/health || exit 1

  # ===========================================
  # DEPLOY VERCEL (Frontend)
  # ===========================================
  deploy-vercel:
    name: Deploy Frontend to Vercel
    needs: [build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Vercel
        run: |
          cd frontend
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify Deployment
        run: |
          sleep 30
          curl -f https://printforge-3d.vercel.app || exit 1